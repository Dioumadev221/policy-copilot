# Regression eval set. Run: python -m evals.run  (exits non-zero if a threshold is missed)
# Each case pins the route; rule cases pin exact outputs, RAG cases pin the section that
# must be retrieved and facts the answer must contain, refusal cases must be declined.

thresholds:
  route_accuracy: 0.95
  rule_exact_match: 1.0     # guaranteed answers: anything below 100% fails the build
  retrieval_hit_at_5: 0.9
  answer_fact_recall: 0.85
  refusal_accuracy: 0.85

cases:
  # ---------------------------------------------------------------- rules (guaranteed)
  - id: leave-basic
    q: "I started on 2021-03-15 and took 6 days off this year. What's my leave balance as of 2025-09-30?"
    route: rule
    rule: annual_leave_balance
    result: {balance_days: 13.5}
  - id: leave-part-time
    q: "I joined on 2024-07-10, work part-time at 0.6 FTE and have taken 2 days. What is my PTO balance as of 2025-02-28?"
    route: rule
    rule: annual_leave_balance
    result: {balance_days: 0.5}
  - id: leave-carryover-senior
    q: "I started on 2015-01-01, have 7 days carried over and took 3 days. What's my vacation balance as of 2025-03-31?"
    route: rule
    rule: annual_leave_balance
    result: {balance_days: 9.0, carryover_days: 5}
  - id: notice-ic
    q: "I'm a software engineer who joined on 2023-02-01 and I resign on 2025-10-01. What is my notice period?"
    route: rule
    rule: notice_period
    result: {notice_months: 2}
  - id: notice-probation-manager
    q: "I'm a manager, started on 2025-01-06. If I resign on 2025-05-01, what notice do I owe?"
    route: rule
    rule: notice_period
    result: {notice_weeks: 2, on_probation: true}
  - id: notice-executive
    q: "I am a director who started on 2018-06-01. What's my notice period if I resign on 2025-06-02?"
    route: rule
    rule: notice_period
    result: {notice_months: 6}
  - id: notice-contract-prevails
    q: "I'm an engineer who started on 2024-01-15 and my contract says 3 months notice. What is my notice period if I quit on 2025-03-01?"
    route: rule
    rule: notice_period
    result: {notice_months: 3}
  - id: overtime-holiday
    q: "I worked 52 hours this week at $30/hour plus 8 hours on a public holiday. What is my pay?"
    route: rule
    rule: overtime_pay
    result: {total_pay: 2160.0, overtime_pay: 960.0}
  - id: overtime-simple
    q: "I worked 45 hours this week and my hourly rate is $22. How much do I get paid?"
    route: rule
    rule: overtime_pay
    result: {total_pay: 1017.5}
  - id: overtime-exempt
    q: "I'm salaried and worked 50 hours this week at $40/hour, do I get overtime?"
    route: rule
    rule: overtime_pay
    result: {overtime_pay: 0.0, exempt: true}
  - id: expense-meal-over-limit
    q: "Can I expense a $95 dinner in Paris? I have the receipt."
    route: rule
    rule: expense_check
    result: {status: partially_approved, reimbursable_amount: 75.0}
  - id: expense-no-receipt
    q: "I spent $40 on a taxi in Austin but lost the receipt. Will it be reimbursed?"
    route: rule
    rule: expense_check
    result: {status: rejected}
  - id: expense-pre-approval
    q: "Can I claim a $1,500 hotel for 3 nights in Tokyo? It was not pre-approved."
    route: rule
    rule: expense_check
    result: {status: needs_pre_approval}
  - id: expense-hotel-tier2
    q: "I paid $520 for 2 nights at a hotel in Berlin and I have the receipt. How much will I get back?"
    route: rule
    rule: expense_check
    result: {status: partially_approved, reimbursable_amount: 360.0}
  - id: expense-client-dinner
    q: "Our client dinner for 4 people in London cost $430, I have the receipt. Can I expense it?"
    route: rule
    rule: expense_check
    result: {status: approved, reimbursable_amount: 430.0}
  - id: expense-late
    q: "I want to claim a $60 lunch with receipt from 120 days ago. Can I get reimbursed?"
    route: rule
    rule: expense_check
    result: {status: rejected}
  - id: remote-remote-first
    q: "I am a backend developer and I passed my probation, can I work remotely?"
    route: rule
    rule: remote_work_eligibility
    result: {eligible: true, max_remote_days_per_week: 5}
  - id: remote-onsite-role
    q: "I'm a lab technician and I passed my probation. Can I work remotely?"
    route: rule
    rule: remote_work_eligibility
    result: {eligible: false}
  - id: remote-standard
    q: "I am an accountant, I completed my probation and my rating meets expectations. How many days can I work from home?"
    route: rule
    rule: remote_work_eligibility
    result: {eligible: true, max_remote_days_per_week: 3}
  - id: remote-probation
    q: "I'm a data analyst still on probation, can I work remotely?"
    route: rule
    rule: remote_work_eligibility
    result: {eligible: false}
  - id: remote-pip
    q: "I am a designer, I passed probation but I'm on a PIP. Can I work remotely?"
    route: rule
    rule: remote_work_eligibility
    result: {eligible: false}

  # ---------------------------------------------------------------- missing input
  - id: needs-start-date
    q: "What's my leave balance? I took 4 days this year."
    route: needs_input
    missing: [start_date]
  - id: needs-rate
    q: "How much overtime pay do I get for working 50 hours this week?"
    route: needs_input
    missing: [hourly_rate]

