<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Copilot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5b6270; --border: #e3e6eb;
    --accent: #2f5bea; --guaranteed: #0f7b4a; --guaranteed-bg: #e5f5ec; --generated: #2f5bea;
    --generated-bg: #e8eefd; --warn: #9a5b00; --warn-bg: #fff4e0; --refused: #8a1f2b; --refused-bg: #fde8ea;
    --code: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e8eaee; --muted: #9aa2b1; --border: #2a2f3a;
      --accent: #7b9bff; --guaranteed: #5fd39b; --guaranteed-bg: #12291f; --generated: #8fa9ff;
      --generated-bg: #172036; --warn: #f2b45a; --warn-bg: #2d2412; --refused: #ff8f9b; --refused-bg: #2e161a;
      --code: #1e222b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
          background: var(--panel); color: var(--text); font: inherit; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 24px; }
  .examples button { background: var(--panel); color: var(--muted); border: 1px solid var(--border);
                     font-weight: 400; font-size: 13px; padding: 6px 10px; text-align: left; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .03em;
           padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; text-transform: uppercase; }
  .rule { color: var(--guaranteed); background: var(--guaranteed-bg); }
  .rag { color: var(--generated); background: var(--generated-bg); }
  .needs_input { color: var(--warn); background: var(--warn-bg); }
  .refused { color: var(--refused); background: var(--refused-bg); }
  .answer { font-size: 17px; margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 13px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 8px; }
  ol.steps { margin: 0; padding-left: 20px; }
  ol.steps li { margin: 2px 0; font-variant-numeric: tabular-nums; }
  details { border-top: 1px solid var(--border); padding: 8px 0; }
  summary { cursor: pointer; }
  pre { white-space: pre-wrap; background: var(--code); padding: 10px; border-radius: 8px; font-size: 13px; margin: 8px 0 0; }
  .kv { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Policy Copilot</h1>
  <p class="sub">HR &amp; compliance assistant for the fictional Helios Robotics. Calculations come from a deterministic rules engine; policy questions are answered from the documents, with citations.</p>

  <form id="f">
    <input id="q" autocomplete="off" placeholder="Ask about leave, notice, overtime, expenses, remote work…" required>
    <button id="go">Ask</button>
  </form>
  <div class="examples" id="ex"></div>

  <section id="out" class="card hidden" aria-live="polite"></section>
</main>
<script>
const EXAMPLES = [
  "I started on 2021-03-15 and took 6 days off this year. What's my leave balance as of 2025-09-30?",
  "I worked 52 hours this week at $30/hour plus 8 hours on a public holiday. What is my pay?",
  "Can I expense a $95 dinner in Paris? I have the receipt.",
  "How long is parental leave for the secondary caregiver?",
  "Who must a personal data breach be reported to, and how fast?",
  "What is the company's stock option vesting schedule?",
];
const LABEL = { rule: "Guaranteed · rules engine", rag: "Generated · from documents",
                needs_input: "Needs more information", refused: "Not in the documents" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

for (const e of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = e;
  b.onclick = () => { $("q").value = e; ask(); };
  $("ex").appendChild(b);
}
$("f").onsubmit = (ev) => { ev.preventDefault(); ask(); };

async function ask() {
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true;
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ question: q }) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (err) {
    $("out").className = "card"; $("out").innerHTML = `<p class="answer">Request failed: ${esc(err.message)}</p>`;
  } finally { $("go").disabled = false; }
}

function render(r) {
  let html = `<span class="badge ${r.route}">${LABEL[r.route]}</span>
    <p class="answer">${esc(r.answer)}</p>
    <div class="meta">${r.latency_ms} ms · provider: ${esc(r.provider)}${r.rule ? ` · rule ${esc(r.rule.name)} · params v${esc(r.rule.params_version)}` : ""}</div>`;
  if (r.rule) {
    html += `<h3>How it was calculated</h3><ol class="steps">${r.rule.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`;
    if (r.rule.assumptions.length) html += `<h3>Assumptions</h3><ol class="steps">${r.rule.assumptions.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`;
    html += `<h3>Inputs</h3><pre class="kv">${esc(JSON.stringify(r.rule.inputs, null, 2))}</pre>`;
  }
  if (r.citations.length) {
    html += `<h3>Sources</h3>` + r.citations.map((c) => `
      <details><summary>[${c.n}] ${esc(c.section)}${c.relevance != null ? ` <span class="meta">· relevance ${c.relevance}</span>` : ""}</summary>
      <pre>${esc(c.snippet)}</pre></details>`).join("");
  }
  $("out").className = "card"; $("out").innerHTML = html;
}
</script>
</body>
</html>
